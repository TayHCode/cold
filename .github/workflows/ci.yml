name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, coldbox]
    steps:
      - uses: actions/checkout@v4
      - run: |
          shellcheck install.sh tests/install_test.sh
          sed '1,/3<<.COLD_INSTALLER.$/d; $d' install.sh | shellcheck -s bash -
      - uses: lycheeverse/lychee-action@v2.6.1
        with:
          args: --exclude '^https://coldpass\.dev' '**/*.md'
          fail: true
      - name: Smoke test
        run: |
          fixture="$(mktemp -d)"
          export COLD_HOME="$fixture/tools" COLD_BIN="$fixture/bin"
          export PATH="$COLD_BIN:$PATH"
          ./install.sh
          test "$(./install.sh | grep -c '^+ git clone ')" -eq 9
          test ! -e "$COLD_HOME"
          ./install.sh --apply
          ./install.sh --apply
          ./install.sh --check
      - run: python3 -m unittest discover -s tests -v
